name: Bundle and Deploy

on:
  push:
    branches:
      - "0.9/stable"
      - "0.9/dev"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bundle-deploy:
    name: Bundle and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Bundle Extensions
        run: npm run bundle
      - name: Deploy to GitHub Pages (stable)
        if: github.ref_name == '0.9/stable'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          cname: read.pirate.vodka
      - name: Deploy to GitHub Pages (dev)
        if: github.ref_name == '0.9/dev'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          destination_dir: dev
          cname: read.pirate.vodka
