name: Feature request
description: Suggest an improvement to an existing extension or the repository.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Please check existing requests first and describe the problem you want to solve.
        Issues are public. Share only public links and remove private account details, credentials, and access tokens.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is missing or difficult, and which extension is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would like. Mention alternatives if useful.
    validations:
      required: true
  - type: input
    id: source-link
    attributes:
      label: Source or reference link (optional)
      description: Include a public link if useful. Do not include login details or token-bearing links.
      placeholder: "https://example.com/"
    validations:
      required: false
